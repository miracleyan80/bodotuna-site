<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>めざせ！はっぴーかんぱにー</title>
<style>
  :root{
    --family:#e23b3b; --safety:#4caf50; --time:#2f7fd1; --money:#f1a900; --growth:#cf7a2e;
    --bg:#f4f7fb; --panel:#ffffff; --ink:#26313d; --line:#d8e0ea; --accent:#ff8a3d; --accent2:#2f7fd1;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#eaf2fb,#f7f1ea);color:var(--ink);}
  h1,h2,h3{margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;
    font-size:15px;font-weight:700;background:var(--accent);color:#fff;transition:.15s;}
  button:hover{filter:brightness(1.05);transform:translateY(-1px);}
  button:disabled{background:#c4ccd6;cursor:not-allowed;transform:none;}
  button.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);}
  button.blue{background:var(--accent2);}
  .wrap{max-width:1200px;margin:0 auto;padding:14px;}

  /* ---------- Title / Setup ---------- */
  #setup{max-width:680px;margin:30px auto;background:var(--panel);border-radius:20px;
    padding:30px;box-shadow:0 12px 40px rgba(40,60,90,.12);}
  .logo{text-align:center;margin-bottom:8px;}
  .logo .sign{display:inline-block;background:#7a5230;color:#ffe;border-radius:10px;padding:4px 14px;
    font-size:16px;transform:rotate(-3deg);box-shadow:0 3px 0 #5d3c22;}
  .logo h1{font-size:38px;color:var(--accent);text-shadow:2px 2px 0 #fff,3px 3px 0 #f0c39a;margin-top:8px;}
  .logo p{color:#5b6b7b;margin:6px 0 0;}
  .seatRow{display:flex;align-items:center;gap:10px;background:#f6f9fd;border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin:8px 0;}
  .seatRow .dot{width:18px;height:18px;border-radius:50%;}
  .seatRow input{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{border-radius:0;background:#fff;color:#5b6b7b;padding:8px 14px;font-size:14px;}
  .seg button.on{background:var(--accent2);color:#fff;}
  .countRow{display:flex;gap:8px;justify-content:center;margin:14px 0;}
  .countRow button{width:44px;height:44px;border-radius:50%;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);}
  .countRow button.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---------- Game ---------- */
  #game{display:none;}
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    background:var(--panel);border-radius:14px;padding:10px 16px;box-shadow:0 4px 16px rgba(40,60,90,.08);margin-bottom:12px;}
  .topbar .turn{font-size:18px;font-weight:800;}
  .topbar .meta{font-size:13px;color:#62718a;display:flex;gap:14px;flex-wrap:wrap;}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:14px;}
  @media(max-width:960px){.layout{grid-template-columns:1fr;}}

  /* Board */
  .board{background:var(--panel);border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(40,60,90,.08);position:relative;}
  .diceStage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;display:none;
    flex-direction:column;align-items:center;gap:7px;pointer-events:none;}
  .diceStage.show{display:flex;animation:fpop .3s ease;}
  .diceWho{background:rgba(38,49,61,.92);color:#fff;font-weight:800;font-size:13px;padding:4px 14px;border-radius:20px;box-shadow:0 3px 10px rgba(0,0,0,.4);}
  .bigdie{width:92px;height:92px;border-radius:20px;background:#fff;border:5px solid #26313d;
    display:flex;align-items:center;justify-content:center;font-size:66px;line-height:1;box-shadow:0 10px 28px rgba(0,0,0,.45);}
  .bigdie.rolling{animation:diceTumble .16s infinite;}
  @keyframes diceTumble{0%{transform:rotate(-20deg) scale(.92);}50%{transform:rotate(20deg) scale(1.08);}100%{transform:rotate(-20deg) scale(.92);}}
  .diceResult{font-size:19px;font-weight:900;color:#fff;padding:5px 18px;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.35);}
  .ring{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:8px;}
  .cell{position:relative;min-height:118px;border-radius:12px;border:2px solid var(--line);
    background:#fbfdff;padding:6px;display:flex;flex-direction:column;font-size:11px;overflow:hidden;}
  .cell.empty{background:#eef2f7;border-style:dashed;}
  .cell.cand{border-color:#ffd9b0;}
  .cell.event{border-color:#bcd6f2;background:#f3f8ff;}
  .cell.fixed{box-shadow:inset 0 0 0 2px #ffe0a3;}
  .cell.cand{min-height:158px;}
  .candimg{width:100%;height:62px;border-radius:8px;overflow:hidden;margin-bottom:4px;background:#eef2f7;}
  .candimg img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block;}
  .evimg{width:100%;height:56px;margin:2px 0 4px;display:flex;align-items:center;justify-content:center;}
  .evimg img{max-height:100%;max-width:70%;object-fit:contain;}
  .empav{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:3px;border:1px solid #ffd9b0;}
  .cell .ttl{font-weight:800;font-size:12px;line-height:1.2;margin-bottom:3px;}
  .cell .phr{color:#6a7686;font-size:10px;line-height:1.15;margin-bottom:4px;flex:1;}
  .cell .hp{position:absolute;top:4px;right:5px;background:linear-gradient(135deg,#ff9ec7,#ffd36e);color:#7a3b00;border:1px solid #ffcfe0;
    border-radius:20px;font-weight:800;font-size:10px;padding:1px 6px;box-shadow:0 1px 3px rgba(255,150,180,.4);}
  .wishline{display:flex;flex-wrap:wrap;gap:3px;}
  .chip{display:inline-flex;align-items:center;gap:2px;border-radius:6px;padding:1px 5px;color:#fff;font-weight:800;font-size:10px;}
  .center{grid-column:2 / 4;grid-row:2 / 3;display:flex;gap:8px;align-items:center;justify-content:center;}
  .pile{flex:1;text-align:center;border-radius:12px;padding:8px 4px;font-weight:800;font-size:12px;color:#fff;}
  .pile small{display:block;font-size:22px;}
  .deckPile{background:linear-gradient(135deg,#5a8fd6,#3d6fb5);}
  .matanePile{background:linear-gradient(135deg,#b6a07e,#8d7758);}
  .pawns{position:absolute;bottom:2px;left:3px;right:3px;display:flex;gap:2px;flex-wrap:wrap;align-items:flex-end;}
  .pawn{width:30px;height:32px;position:relative;display:flex;align-items:center;justify-content:center;}
  .pawn svg{width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));}
  .pawn .pnum{position:absolute;bottom:-2px;right:-3px;min-width:14px;height:14px;border-radius:8px;
    font-size:9px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;padding:0 2px;}
  .pawn.human svg{filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 2px var(--accent)) drop-shadow(0 1px 2px rgba(0,0,0,.45));}
  .pawn.cur{width:46px;height:50px;z-index:8;animation:bob .8s infinite;}
  .pawn.cur svg{filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 4px var(--accent)) drop-shadow(0 2px 4px rgba(0,0,0,.5));}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .cell.meHere{box-shadow:inset 0 0 0 3px var(--accent);}
  .meArrow{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:var(--accent);
    color:#fff;font-size:10px;font-weight:800;padding:1px 9px;border-radius:11px;z-index:9;white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.35);}
  .cell.target{outline:3px solid var(--accent);cursor:pointer;animation:pulse 1s infinite;}
  @keyframes pulse{50%{outline-color:#ffd9b0;}}

  /* Players */
  .players{display:flex;flex-direction:column;gap:10px;}
  .pcard{background:var(--panel);border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(40,60,90,.07);
    border-left:6px solid #ccc;}
  .pcard.active{box-shadow:0 0 0 3px var(--accent),0 6px 18px rgba(255,138,61,.25);}
  .pcard .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .pcard .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;}
  .pcard .sc{font-weight:800;color:#7a3b00;background:linear-gradient(135deg,#ff9ec7,#ffd36e);border-radius:20px;padding:3px 12px;font-size:13px;box-shadow:0 2px 6px rgba(255,150,180,.4);}
  .happyRow{display:flex;align-items:center;gap:6px;font-weight:800;color:#7a3b00;font-size:14px;
    background:linear-gradient(135deg,#ffe6f0,#fff4d6);border:1px solid #ffd0e0;border-radius:12px;padding:5px 10px;margin-bottom:7px;}
  .happyRow .hpv{font-size:20px;color:#e2568f;margin-left:auto;text-shadow:0 1px 0 #fff;}
  .happyRow .spk{animation:sparkle 1.1s infinite;}
  .cover{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
  .covbox{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:#fff;border-radius:7px;padding:2px 7px;}
  .covbox.zero{opacity:.32;}
  .covbox b{font-size:13px;}
  .loc{font-size:11.5px;color:#41617f;background:#eef4fb;border-radius:7px;padding:2px 8px;margin-bottom:6px;display:inline-block;}
  .tag{font-size:10px;font-weight:800;border-radius:9px;padding:1px 7px;vertical-align:middle;}
  .tag.you{background:var(--accent);color:#fff;}
  .tag.ai{background:#e4eaf1;color:#6a7686;}
  .pcard.you{border-left-width:8px;background:linear-gradient(180deg,#fffaf4,#fff);}
  .welset,.empset{display:flex;flex-wrap:wrap;gap:4px;}
  .wbadge{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;background:#f7fafc;display:flex;gap:3px;align-items:center;}
  .wbadge.social{border:2px solid #2f7fd1;background:#eef5fc;}
  .wbimg{width:20px;height:20px;object-fit:contain;border-radius:4px;background:#fff;}
  .shamini{background:#2f7fd1;color:#fff;font-size:9px;font-weight:800;border-radius:4px;padding:0 3px;}
  .emp{font-size:10px;background:#fff7ee;border:1px solid #ffe0bd;border-radius:6px;padding:1px 5px;}
  .secLabel{font-size:10px;color:#8a98a8;font-weight:700;margin:4px 0 2px;}

  /* Hand & actions */
  .hand{background:var(--panel);border-radius:14px;padding:12px;box-shadow:0 4px 16px rgba(40,60,90,.08);margin-top:12px;}
  .hcards{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;min-height:80px;}
  .hc{width:96px;border-radius:10px;border:2px solid var(--line);background:#fff;padding:7px;font-size:11px;position:relative;cursor:pointer;transition:.12s;}
  .hc.social{border-color:#2f7fd1;box-shadow:inset 0 0 0 2px #d6e6f7;}
  .hc .shabadge{position:absolute;top:5px;left:6px;background:#2f7fd1;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;z-index:2;}
  .hcimg{width:100%;height:46px;border-radius:7px;overflow:hidden;background:#f4f8fd;margin:3px 0 4px;display:flex;align-items:center;justify-content:center;}
  .hcimg img{max-width:92%;max-height:100%;object-fit:contain;}
  .hc:hover{transform:translateY(-3px);border-color:var(--accent);}
  .hc.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
  .hc.disc{border-color:#e23b3b;box-shadow:0 0 0 2px #e23b3b;opacity:.85;}
  .hc .hcn{font-weight:800;font-size:12px;margin-bottom:4px;}
  .hc .cost{position:absolute;top:5px;right:6px;background:#26313d;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .dice{width:54px;height:54px;border-radius:12px;background:#fff;border:2px solid var(--ink);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .dice.rolling{animation:diceshake .18s infinite;}
  @keyframes diceshake{0%,100%{transform:rotate(-12deg) translateY(0);}50%{transform:rotate(12deg) translateY(-3px);}}
  .hint{font-size:13px;color:#62718a;}
  /* 速度コントロール */
  .speedctl{display:flex;align-items:center;gap:4px;font-size:12px;color:#62718a;font-weight:700;}
  .spbtn{background:#fff;color:#5b6b7b;border:2px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;}
  .spbtn.on{background:var(--accent2);color:#fff;border-color:var(--accent2);}

  /* 社員候補マスの演出 */
  .sceneBg{position:fixed;inset:0;background:rgba(16,28,42,.62);display:none;align-items:center;justify-content:center;z-index:80;cursor:pointer;}
  .sceneCard{background:#fff;border-radius:22px;padding:20px 26px 16px;width:330px;max-width:92vw;text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.4);transform:scale(.7);opacity:0;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .3s;}
  .sceneCard.show{transform:scale(1);opacity:1;}
  .sceneWho{font-size:13px;font-weight:800;color:#41617f;margin-bottom:8px;}
  .sceneImgWrap{width:150px;height:150px;margin:0 auto 6px;border-radius:50%;overflow:hidden;border:5px solid #ffe0a3;
    background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 6px 16px rgba(0,0,0,.18);}
  .sceneCard.show .sceneImgWrap{animation:popimg .5s ease;}
  @keyframes popimg{0%{transform:scale(.5);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
  .sceneImgWrap img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;}
  .sceneBubble{font-size:13px;color:#33414f;background:#f4f8fd;border:1px solid #dce6f1;border-radius:12px;padding:6px 10px;margin-bottom:10px;}
  .sceneBubble b{font-size:16px;display:block;margin-top:2px;}
  .sceneWishes{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .wrow{display:flex;align-items:center;gap:7px;font-size:13px;background:#f7fafc;border-radius:8px;padding:3px 9px;}
  .wrow .chip{color:#fff;}
  .wrow .wlbl{flex:1;text-align:left;font-weight:700;color:#46586a;}
  .wrow .wnum{font-weight:800;}
  .wrow .wmark{font-weight:900;width:18px;}
  .wrow.ok{background:#e9f8ec;} .wrow.ok .wmark{color:#2faf4d;} .wrow.ok .wnum{color:#2faf4d;}
  .wrow.ng{background:#fdeceb;} .wrow.ng .wmark{color:#e23b3b;} .wrow.ng .wnum{color:#e23b3b;}
  .sceneBanner{font-size:19px;font-weight:900;border-radius:12px;padding:9px;color:#fff;}
  .sceneCard.show .sceneBanner{animation:bannerpop .45s ease .15s both;}
  @keyframes bannerpop{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .sceneBanner.join{background:linear-gradient(135deg,#3fb763,#2f9e52);}
  .sceneBanner.leave{background:linear-gradient(135deg,#8d97a4,#6d7785);}
  .sceneBanner.think{background:linear-gradient(135deg,#f0a93c,#e08e23);}
  .sceneBanner.good{background:linear-gradient(135deg,#3fb763,#2f9e52);}
  .sceneBanner.bad{background:linear-gradient(135deg,#8d97a4,#6d7785);}
  .sceneBanner.festive{background:linear-gradient(135deg,#ff7eb3,#ff8a3d);}
  .sceneBanner.rest{background:linear-gradient(135deg,#e2683b,#c23b1e);}
  .sceneBanner.move{background:linear-gradient(135deg,#7a5cd0,#5a3fb0);}
  .sceneHint{font-size:11px;color:#9aa7b5;margin-top:8px;}
  /* イベント演出 */
  .sceneConfetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:1;}
  .sceneCard.event{position:relative;z-index:2;}
  .evScene{width:130px;height:130px;margin:4px auto 6px;display:flex;align-items:center;justify-content:center;
    background:#f4f8fd;border-radius:18px;border:3px solid #e3ecf5;}
  .evScene img{max-width:84%;max-height:84%;object-fit:contain;}
  .sceneCard.event.festive .evScene{background:#fff3f8;border-color:#ffd1e4;}
  .sceneCard.show .evScene{animation:popimg .5s ease;}
  .evName{font-size:21px;font-weight:900;color:#33414f;}
  .evDesc{font-size:13px;color:#62718a;margin:4px 10px 10px;line-height:1.4;}
  .evStamp{display:inline-block;font-size:26px;font-weight:900;color:#e2683b;border:4px solid #e2683b;
    border-radius:12px;padding:4px 16px;transform:rotate(-9deg);margin:2px 0 10px;letter-spacing:2px;
    text-shadow:0 1px 0 #fff;box-shadow:0 2px 8px rgba(226,104,59,.25);}
  .sceneCard.show .evStamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes stamp{0%{transform:rotate(-9deg) scale(2.4);opacity:0;}70%{transform:rotate(-9deg) scale(.85);}100%{transform:rotate(-9deg) scale(1);opacity:1;}}
  .festive{font-size:24px;letter-spacing:4px;margin-bottom:2px;animation:sparkle 1s infinite;}
  @keyframes sparkle{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}

  /* 終了演出 */
  .finaleBg{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1d3350,#0c1726);
    display:none;flex-direction:column;align-items:center;justify-content:center;z-index:90;overflow:hidden;cursor:pointer;}
  .confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .finaleStage{color:#fff;text-align:center;z-index:2;min-height:160px;display:flex;align-items:center;justify-content:center;padding:20px;}
  .fbig{font-size:42px;font-weight:900;text-shadow:0 3px 14px rgba(0,0,0,.5);line-height:1.3;}
  .fsub{font-size:24px;font-weight:800;color:#ffe2a8;}
  .finaleStage.pop .fbig,.finaleStage.pop .winnerWrap{animation:fpop .5s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes fpop{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  .winnerWrap{text-align:center;color:#fff;}
  .winnerWrap .crown{font-size:46px;animation:swing 1.2s ease-in-out infinite;}
  @keyframes swing{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  .winnerMeeples{display:flex;gap:6px;justify-content:center;margin:6px 0;}
  .winnerAv{width:120px;height:120px;display:inline-flex;}
  .winnerAv svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,210,74,.7)) drop-shadow(0 8px 20px rgba(0,0,0,.5));animation:bob 1s infinite;}
  .winnerName{font-size:34px;font-weight:900;color:#ffe27a;text-shadow:0 3px 12px rgba(0,0,0,.5);}
  .winnerHp{font-size:18px;color:#fff;margin-top:4px;}
  .finaleRank{display:none;z-index:2;background:#fff;border-radius:16px;padding:16px 18px;margin-top:18px;
    width:380px;max-width:92vw;box-shadow:0 16px 50px rgba(0,0,0,.4);animation:fpop .4s both;}
  .finaleRank table{width:100%;border-collapse:collapse;}
  .finaleRank td,.finaleRank th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;font-size:14px;}
  .finaleRank .rkav{width:26px;height:26px;display:inline-flex;vertical-align:middle;margin-right:4px;}
  .finaleRank .rkav svg{width:100%;height:100%;}
  .finaleRank tr.win{background:#fff8e6;font-weight:800;}

  /* Log */
  .logwrap{margin-top:12px;}
  .logbar{display:flex;justify-content:space-between;align-items:center;background:#10202f;color:#cfe3f5;
    border-radius:12px 12px 0 0;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;user-select:none;}
  .logbar .logtgl{color:#9fc3e6;font-size:12px;}
  .log{background:#10202f;color:#cfe3f5;border-radius:0 0 14px 14px;padding:12px;height:140px;overflow:auto;font-size:12.5px;line-height:1.5;}
  .logwrap.collapsed .logbar{border-radius:12px;}
  .logwrap.collapsed .log{display:none;}
  .log div{margin-bottom:3px;}
  .log .sys{color:#ffd28a;}
  .log .good{color:#9be29b;}
  .log .bad{color:#ff9b9b;}

  /* Modal */
  .modalbg{position:fixed;inset:0;background:rgba(20,30,45,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:18px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h2{margin-bottom:10px;}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .winner{text-align:center;}
  .winner .crown{font-size:50px;}
  table.rank{width:100%;border-collapse:collapse;margin-top:12px;}
  table.rank td,table.rank th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:14px;}
  .rulebox{font-size:14px;line-height:1.7;}
  .rulebox b{color:var(--accent2);}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;}

  /* ===== フローティング操作パネル ===== */
  .boardarea{position:relative;}
  .hand.floatpanel{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    width:60%;min-width:300px;max-width:460px;z-index:30;padding:0;max-height:80%;overflow:auto;
    box-shadow:0 12px 44px rgba(20,40,70,.4);border:2px solid var(--accent);}
  .panelBar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
    background:var(--accent);color:#fff;border-radius:12px 12px 0 0;font-weight:800;font-size:14px;position:sticky;top:0;}
  .panelBar button{background:rgba(255,255,255,.25);color:#fff;padding:4px 10px;font-size:12px;border-radius:8px;}
  .panelBody{padding:12px;}
  .hand.floatpanel.collapsed{display:none;}
  .reopenBtn{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:30;display:none;
    box-shadow:0 6px 22px rgba(255,138,61,.5);}

  /* ===== 福利厚生クローズアップ ===== */
  .ccBg{position:fixed;inset:0;background:rgba(16,28,42,.62);display:none;align-items:center;justify-content:center;z-index:85;padding:16px;}
  .ccInner{width:340px;max-width:94vw;max-height:90vh;overflow:auto;text-align:center;}
  .ccCard{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 14px 14px;position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.4);transform:scale(.8);opacity:0;animation:fpop .35s cubic-bezier(.2,1.4,.4,1) forwards;}
  .ccCard.social{border-color:#2f7fd1;box-shadow:0 0 0 3px #d6e6f7,0 18px 50px rgba(0,0,0,.4);}
  .ccCard .shabadge{position:absolute;top:10px;left:12px;background:#2f7fd1;color:#fff;font-size:13px;font-weight:800;border-radius:8px;padding:2px 9px;}
  .ccCost{position:absolute;top:10px;right:12px;background:#26313d;color:#fff;font-size:13px;font-weight:800;border-radius:10px;padding:2px 10px;}
  .ccImg{width:150px;height:150px;margin:8px auto 6px;display:flex;align-items:center;justify-content:center;background:#f4f8fd;border-radius:14px;}
  .ccImg img{max-width:88%;max-height:88%;object-fit:contain;}
  .ccName{font-size:24px;font-weight:900;color:#2a3744;}
  .ccWish{margin-top:6px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .ccWishLbl{font-size:11px;color:#62718a;font-weight:700;}
  .ccWho{font-size:13px;font-weight:800;color:#41617f;margin-bottom:8px;}
  .ccHint{font-size:11px;color:#cfe0f0;margin-top:10px;}
  /* 導入者リボン（誰が導入したか） */
  .ccCard.announce{overflow:hidden;padding-top:0;}
  .ccAdoptedBy{margin:0 -14px 12px;padding:10px 12px;color:#fff;font-weight:900;font-size:16px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.25);letter-spacing:.5px;}
  .ccCard.announce .ccCost{top:50px;}
  .ccCard.announce .shabadge{top:50px;}
  .ccCard.announce .ccImg{width:124px;height:124px;}
  /* 解説を目立たせる */
  .ccDesc{background:#fffdf2;border:2px solid #ffe39a;border-left:7px solid #ffbb2e;border-radius:13px;margin-top:12px;
    padding:13px 16px;text-align:left;box-shadow:0 8px 22px rgba(0,0,0,.22);}
  .ccDesc .ccDescLbl{display:inline-block;font-size:11.5px;color:#fff;background:#ffae33;font-weight:800;border-radius:8px;padding:2px 10px;margin-bottom:7px;}
  .ccDesc .ccDescTxt{font-size:16px;line-height:1.65;color:#2a3744;font-weight:700;}
  /* コスト支払い欄を分かりやすく */
  .ccPay{margin-top:12px;font-size:13px;color:#2f7f4d;background:#eafaef;border:1px dashed #9bd6ad;border-radius:10px;padding:8px 10px;font-weight:700;}
  .ccPay.bad{background:#fdeceb;border-color:#e6a9a2;color:#c0392b;}
  .ccPayBox{margin-top:12px;background:#fff8ec;border:2px solid #f3c98a;border-radius:14px;padding:11px 12px;text-align:left;}
  .ccPayHead{font-size:14.5px;font-weight:900;color:#b06b00;margin-bottom:3px;}
  .ccPaySub{font-size:12.5px;color:#7a5a2a;margin-bottom:9px;}
  .ccPayCount{display:inline-block;background:#f3c98a;color:#7a4a00;border-radius:10px;padding:1px 9px;font-weight:800;margin-left:4px;}
  .ccPayCount.ok{background:#3fb763;color:#fff;}
  .ccFodder{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .ccfd{background:#fff;border:2px solid var(--line);border-radius:11px;padding:7px 6px 6px;width:80px;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.12s;}
  .ccfd:hover{transform:translateY(-2px);}
  .ccfd.on{border-color:#e23b3b;background:#fff0ef;box-shadow:0 0 0 2px #e23b3b;}
  .ccfdCheck{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#cbd3dd;color:#fff;
    font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
  .ccfd.on .ccfdCheck{background:#e23b3b;}
  .ccfdImg{width:36px;height:36px;object-fit:contain;}
  .ccfdName{font-size:10.5px;font-weight:800;color:#46586a;line-height:1.15;text-align:center;}
  .ccfdCost{position:absolute;top:-8px;left:-8px;width:20px;height:20px;border-radius:50%;background:#26313d;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
  .ccBtns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}

  /* ===== オープニング ===== */
  .openingBg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:95;overflow:hidden;
    background:linear-gradient(180deg,#aee0ff 0%,#d9f0ff 42%,#fff3e0 75%,#ffe6c2 100%);}
  .opTown{position:absolute;left:0;right:0;bottom:0;height:170px;}
  .opFloat{position:absolute;inset:0;pointer-events:none;}
  .opContent{position:relative;z-index:2;text-align:center;max-width:600px;padding:24px;animation:fpop .6s ease both;}
  .opSignRow{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:4px;flex-wrap:wrap;}
  .opSign{display:inline-block;background:#7a5230;color:#ffe;border-radius:10px;padding:5px 18px;font-size:20px;font-weight:800;transform:rotate(-3deg);box-shadow:0 3px 0 #5d3c22;}
  .opGenre{font-size:15px;font-weight:800;color:#5b6b7b;}
  .opTitle{font-size:clamp(34px,9vw,58px);color:var(--accent);text-shadow:2px 2px 0 #fff,4px 4px 0 #f0c39a;margin:2px 0;}
  .opMascot{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #ffe0a3;background:#fff;margin:6px 0;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:bob 1.4s infinite;}
  .opText{font-size:clamp(14px,3.4vw,17px);line-height:1.9;color:#34414f;background:rgba(255,255,255,.78);border-radius:16px;padding:16px 20px;margin:10px auto 18px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .opText b{color:#2a3744;} .opRed{color:#e23b3b;font-weight:800;}
  .opStart{font-size:19px;padding:13px 34px;box-shadow:0 8px 22px rgba(255,138,61,.45);animation:pulse2 1.6s infinite;}
  @keyframes pulse2{50%{transform:scale(1.04);}}
  .opBuilding{position:absolute;bottom:0;border-radius:5px 5px 0 0;box-shadow:inset -8px 0 0 rgba(0,0,0,.06);}
  .opWin{position:absolute;background:rgba(255,255,255,.85);border-radius:1px;}
  .opSun{position:absolute;top:8%;right:10%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#ffe680,#ffcf4d);box-shadow:0 0 40px rgba(255,207,77,.7);}
  .opWish{position:absolute;font-size:26px;opacity:.9;animation:floatUp linear infinite;}
  @keyframes floatUp{0%{transform:translateY(20px);opacity:0;}10%{opacity:.9;}100%{transform:translateY(-120px);opacity:0;}}

  /* ===== スマホ縦：盤面＋手札が1画面に収まるようコンパクト化（末尾に置いて上書き） ===== */
  @media(max-width:600px){
    .wrap{padding:7px;}
    .layout{gap:8px;}
    .topbar{padding:6px 9px;gap:5px;}
    .topbar .turn{font-size:14px;}
    .topbar .meta{font-size:10px;gap:6px;}
    .speedctl{font-size:10px;gap:3px;}
    .spbtn{padding:3px 6px;font-size:10px;}
    .topbar button.ghost{padding:5px 9px;font-size:11px;}
    .board{padding:7px;}
    .ring{gap:4px;}
    .cell{min-height:0;font-size:9.5px;padding:3px;border-width:1.5px;}
    .cell.cand{min-height:0;}
    .candimg{height:30px;margin-bottom:2px;}
    .evimg{height:24px;margin:1px 0 2px;}
    .cell .ttl{font-size:9.5px;margin-bottom:1px;line-height:1.1;}
    .cell .phr{display:none;}
    .cell .hp{font-size:8px;padding:0 4px;top:2px;right:3px;}
    .wishline{gap:2px;}
    .chip{font-size:8px;padding:0 3px;}
    .center{gap:4px;}
    .pile{font-size:9px;padding:4px 2px;}
    .pile small{font-size:14px;}
    .pawns{gap:2px;bottom:1px;}
    .pawn{width:18px;height:18px;border-width:2px;}
    .pawn .pnum{width:11px;height:11px;font-size:8px;bottom:-3px;right:-3px;}
    .pawn.cur{width:25px;height:28px;}
    .meArrow{font-size:8px;padding:0 5px;top:1px;}
    .hand.floatpanel{width:94%;min-width:0;max-width:none;bottom:6px;}
    .panelBody{padding:9px;}
    #handTitle{font-size:13px;}
    .phaseHint,.hint{font-size:11px;}
    .hcards{gap:5px;min-height:0;margin-top:6px;}
    .hc{width:66px;padding:5px;}
    .hcimg{height:28px;margin:2px 0 3px;}
    .hc .hcn{font-size:10px;}
    .hc .wishline{gap:2px;}
    .hc .cost{width:16px;height:16px;font-size:9px;top:3px;right:4px;}
    .hc .shabadge{font-size:8px;padding:0 3px;top:3px;left:4px;}
    .actions{margin-top:8px;gap:6px;}
    .actions button{padding:8px 12px;font-size:13px;}
    .diceStage .bigdie{width:72px;height:72px;font-size:50px;}
    .diceWho{font-size:11px;padding:3px 10px;}
    .diceResult{font-size:15px;padding:3px 12px;}
    .players{margin-top:2px;}
    .logwrap{margin-top:8px;}
  }
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<div class="wrap">
<div id="setup">
  <div class="logo">
    <div class="sign">めざせ！</div>
    <h1>はっぴーかんぱにー</h1>
    <img id="mascot" alt="" style="width:84px;height:84px;border-radius:50%;object-fit:cover;margin:4px 0;display:none;border:3px solid #ffe0a3;">
    <p>会社の社長となって福利厚生を導入し、社員と家族の願いをかなえよう！</p>
  </div>
  <h3 style="margin-top:18px;">会社の数を選ぶ</h3>
  <div class="countRow" id="countRow"></div>
  <h3>各社の社長</h3>
  <div id="seats"></div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;">
    <button class="ghost" onclick="showRules()">遊び方</button>
    <button onclick="startGame()" style="padding:12px 30px;font-size:17px;">ゲーム開始 ▶</button>
  </div>
</div>
</div>

<!-- ================= GAME ================= -->
<div id="game" class="wrap">
  <div class="topbar">
    <div>
      <div class="turn" id="turnInfo">―</div>
      <div class="meta" id="metaInfo"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <div id="audioCtl" class="speedctl"></div>
      <div id="speedCtl" class="speedctl"></div>
      <button class="ghost" onclick="showRules()">遊び方</button>
      <button class="ghost" onclick="location.reload()">最初から</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="boardarea" id="boardarea">
        <div class="board" id="board"><div class="ring" id="ring"></div><div class="diceStage" id="diceStage"></div></div>
        <div class="hand floatpanel" id="handPanel">
          <div class="panelBar">
            <span id="handTitle">あなたの操作</span>
            <button onclick="collapsePanel()">盤面を見る ✕</button>
          </div>
          <div class="panelBody">
            <span class="hint" id="phaseHint"></span>
            <div class="hcards" id="hand"></div>
            <div class="actions" id="actions"></div>
          </div>
        </div>
        <button class="reopenBtn" id="reopenBtn" onclick="openPanel()">🛠 操作パネルを開く ▲</button>
      </div>
      <div class="logwrap collapsed" id="logwrap">
        <div class="logbar" onclick="toggleLog()">
          <span>📜 ゲームの記録</span>
          <span class="logtgl">開く ▼</span>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>
    <div class="players" id="players"></div>
  </div>
</div>

<!-- ================= MODAL ================= -->
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>

<!-- ============ 社員候補マス演出 ============ -->
<div class="sceneBg" id="sceneBg"><canvas class="sceneConfetti" id="sceneConfetti"></canvas><div class="sceneCard" id="sceneCard"></div></div>

<!-- ============ オープニング ============ -->
<div class="openingBg" id="openingBg">
  <div class="opTown" id="opTown"></div>
  <div class="opFloat" id="opFloat"></div>
  <div class="opContent">
    <div class="opSignRow"><span class="opSign">めざせ！</span><span class="opGenre">福利厚生体験ゲーム</span></div>
    <h1 class="opTitle">はっぴーかんぱにー</h1>
    <img id="opMascot" class="opMascot" alt="">
    <p class="opText">このゲームは、<b>会社の福利厚生を学べるゲーム</b>です。会社の社長となったあなたは、働きたいと思っている人（社員候補）と、その<b>家族が求めている福利厚生</b>を会社に取り入れ、多くの<span class="opRed">社員と家族の願い</span>をかなえる<span class="opRed">「はっぴーかんぱにー」</span>を目指します！</p>
    <button class="opStart" onclick="closeOpening()">▶ ゲームスタート</button>
  </div>
</div>

<!-- ============ 福利厚生クローズアップ ============ -->
<div class="ccBg" id="ccBg"><div class="ccInner" id="ccInner"></div></div>

<!-- ============ 終了演出 ============ -->
<div class="finaleBg" id="finaleBg">
  <canvas class="confetti" id="confetti"></canvas>
  <div class="finaleStage" id="finaleStage"></div>
  <div class="finaleRank" id="finaleRank"></div>
</div>

/* =================================================================
   サウンド（Web Audio API でその場生成。外部ファイル不要）
   ================================================================= */
const AUD={ctx:null,master:null,bgmGain:null,bgmTimer:null,bgmOn:true,seOn:true};
function audioInit(){
  if(AUD.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    AUD.ctx=new C();
    AUD.master=AUD.ctx.createGain();AUD.master.gain.value=0.9;AUD.master.connect(AUD.ctx.destination);
    AUD.bgmGain=AUD.ctx.createGain();AUD.bgmGain.gain.value=0;AUD.bgmGain.connect(AUD.master);
  }catch(e){}
}
function audioResume(){if(AUD.ctx&&AUD.ctx.state==='suspended')AUD.ctx.resume();}
function tone(freq,start,dur,type,vol,dest){
  const ctx=AUD.ctx;if(!ctx)return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(dest||AUD.master);
  g.gain.setValueAtTime(0.0001,start);g.gain.linearRampToValueAtTime(vol,start+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.start(start);o.stop(start+dur+0.03);
}
function playSE(name){
  if(!AUD.ctx||!AUD.seOn)return;audioResume();
  const t=AUD.ctx.currentTime;
  const T=(f,s,d,ty,v)=>tone(f,t+s,d,ty||'square',v==null?0.18:v,AUD.master);
  switch(name){
    case'click':T(680,0,.07,'square',.10);break;
    case'dice':T(180+Math.random()*320,0,.05,'square',.10);break;
    case'step':T(340,0,.05,'square',.09);break;
    case'adopt':T(880,0,.09,'square',.13);T(1320,.09,.12,'square',.13);break;
    case'join':[523.25,659.25,783.99,1046.5].forEach((f,i)=>T(f,i*.10,.20,'triangle',.16));break;
    case'leave':T(440,0,.18,'sine',.16);T(330,.16,.22,'sine',.14);T(220,.36,.34,'sine',.12);break;
    case'think':T(520,0,.12,'sine',.12);T(415,.15,.18,'sine',.10);break;
    case'buzzer':T(196,0,.28,'sawtooth',.18);T(185,0,.28,'square',.12);T(160,.3,.5,'sawtooth',.18);break;
    case'gong':T(120,0,1.3,'sine',.30);T(181,0,1.3,'triangle',.10);break;
    case'drum':for(let i=0;i<7;i++)T(155,i*.055,.05,'square',.12);break;
    case'win':{[523.25,659.25,783.99,1046.5,987.77,1046.5,1318.5].forEach((f,i)=>T(f,i*.13,.24,'triangle',.18));
      [261.63,329.63,392].forEach(f=>T(f,0,1.6,'sine',.05));break;}
  }
}
/* BGM：Cメジャーの優しいループ（C–G–Am–F） */
function bgmPhrase(){
  const ctx=AUD.ctx;if(!ctx)return 3.84;
  const t0=ctx.currentTime+0.06,b=0.48;
  const chords=[{bass:130.81,tri:[261.63,329.63,392.00]},
                {bass:98.00,tri:[196.00,246.94,293.66]},
                {bass:110.00,tri:[220.00,261.63,329.63]},
                {bass:87.31,tri:[174.61,220.00,261.63]}];
  chords.forEach((c,ci)=>{const ts=t0+ci*2*b;
    tone(c.bass,ts,b*1.8,'triangle',0.16,AUD.bgmGain);
    c.tri.forEach(f=>tone(f,ts,b*1.9,'sine',0.045,AUD.bgmGain));});
  const lead=[659.25,587.33,523.25,587.33,659.25,783.99,659.25,523.25];
  lead.forEach((f,bi)=>tone(f,t0+bi*b,b*0.85,'triangle',0.06,AUD.bgmGain));
  return 8*b;
}
function bgmStart(){
  if(!AUD.ctx||AUD.bgmTimer)return;
  const len=bgmPhrase();
  AUD.bgmTimer=setInterval(()=>{if(AUD.ctx.state==='running')bgmPhrase();},len*1000);
}

/* 紙吹雪 */
function launchConfetti(canvas,ms2){
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.offsetWidth,H=canvas.height=canvas.offsetHeight;
  const cols=['#e23b3b','#4caf50','#2f7fd1','#f1a900','#cf7a2e','#ff8a3d'];
  const ps=[];for(let i=0;i<140;i++)ps.push({x:Math.random()*W,y:Math.random()*-H,
    w:6+Math.random()*7,h:8+Math.random()*8,c:cols[i%cols.length],
    vy:2+Math.random()*3,vx:-1.5+Math.random()*3,rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let stop=false;const t0=performance.now();
  (function loop(now){if(stop)return;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;if(p.y>H){p.y=-10;p.x=Math.random()*W;}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(now-t0<ms2)requestAnimationFrame(loop);else ctx.clearRect(0,0,W,H);
  })(t0);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  const n=setupCfg.count;
  const players=[];
  for(let i=0;i<n;i++){
    players.push({
      id:i,name:setupCfg.seats[i].name||('社長'+(i+1)),ai:setupCfg.seats[i].ai,
      color:PCOLORS[i],avatar:PAWN_IMAGES[i],
      welfare:[ clone(WELFARE.find(w=>w.n==='健康保険')), clone(WELFARE.find(w=>w.n==='厚生年金')) ],
      employees:[], hand:[], pos:START_CELL, skip:false
    });
  }
  // 福利厚生山札（16種×4 − 配布分）
  let wdeck=[];
  WELFARE.forEach(w=>{for(let k=0;k<4;k++)wdeck.push(clone(w));});
  // 配布した 健康保険×n・厚生年金×n を山札から除く
  removeN(wdeck,'健康保険',n);removeN(wdeck,'厚生年金',n);
  shuffle(wdeck);
  players.forEach(p=>{for(let k=0;k<3;k++)p.hand.push(wdeck.pop());});

  // 中央山札（社員候補＆イベント）
  const startCands=CANDIDATES.filter(c=>c.start).map(clone);
  const restCands=CANDIDATES.filter(c=>!c.start).map(clone);
  const deckEvents=['不景気','ヘッドハンティング','コストダウン','労働基準監督署','労働基準監督署']
    .map(name=>({event:name,desc:EVENTS[name].desc}));
  let cdeck=shuffle([...restCands.map(c=>({cand:c})),...deckEvents]);

  // 盤面リング配置
  const cells=new Array(10).fill(null);
  cells[START_CELL]={type:'fixed',name:'好景気',desc:EVENTS['好景気'].desc};
  cells[JIGYO_CELL]={type:'fixed',name:'事業支援制度',desc:EVENTS['事業支援制度'].desc};
  // 残り8マスへ：開始候補7＋山札から1
  const openIdx=[];for(let i=0;i<10;i++)if(!cells[i])openIdx.push(i);
  shuffle(startCands);
  openIdx.forEach((idx,k)=>{
    if(k<startCands.length){cells[idx]={type:'cand',cand:startCands[k]};}
    else{cells[idx]=drawCell(cdeck);}
  });

  G={players,wdeck,wdiscard:[],cdeck,matane:[],cells,
     cur:0,startPlayer:0,phase:'start',ending:false,dice:0,
     adoptSel:null,discardSel:[],targetMode:null,over:false,
     adoptedThisTurn:false,panelOpen:false};
  document.getElementById('setup').parentElement.style.display='none';
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  renderSpeed();renderAudio();
  audioInit();audioResume();playSE('click');
  if(AUD.bgmOn){AUD.bgmGain.gain.setValueAtTime(0.5,AUD.ctx.currentTime);bgmStart();}
  log('ゲーム開始！ めざせ、はっぴーかんぱにー！','sys');
  log('テンポは右上「速度」、音は「BGM／効果音」で調整できます。','sys');
  // 盤面（コマ・候補の輪）をタップすると操作パネルを畳む
  const boardEl=document.getElementById('board');
  if(boardEl&&!boardEl._collapseBound){boardEl._collapseBound=true;
    boardEl.addEventListener('click',()=>{if(G&&!G.over&&!G.players[G.cur].ai&&G.panelOpen)collapsePanel();});}
  render();
  showOpening();   // オープニング演出 → 閉じると beginTurn
}

function buildOpeningScene(){
  // 街（ビル群）＝ストーリーの背景

function clone(o){return JSON.parse(JSON.stringify(o));}
function removeN(deck,name,cnt){let r=0;for(let i=deck.length-1;i>=0&&r<cnt;i--){if(deck[i].n===name){deck.splice(i,1);r++;}}}
function drawCell(cdeck){
  if(cdeck.length===0)return null;
  const c=cdeck.pop();
  return c.cand?{type:'cand',cand:c.cand}:{type:'event',name:c.event,desc:c.desc};
}

/* =================================================================
   会社の願いカバー量
   ================================================================= */
function coverage(p){
  const c={family:0,safety:0,time:0,money:0,growth:0};
  p.welfare.forEach(w=>w.c.forEach(k=>c[k]++));
  return c;
}
function satisfies(p,cand){
  const cov=coverage(p);
  return Object.keys(cand.w).every(k=>cov[k]>=cand.w[k]);
}
function hasType(p,name){return p.welfare.some(w=>w.n===name);}
function score(p){return p.employees.reduce((s,e)=>s+e.hp,0);}
function cellName(i){const c=G.cells[i];if(!c)return '空きマス';
  return c.type==='cand'?`社員候補「${c.cand.ph}」`:c.name;}

/* =================================================================
   ターン進行
   ================================================================= */
function beginTurn(){
  const p=G.players[G.cur];
  G.phase='action';G.adoptSel=null;G.discardSel=[];G.dice=0;
  G.adoptedThisTurn=false;G.panelOpen=!p.ai;  // 自分の番は操作パネルを開く
  if(p.skip){
    p.skip=false;
    log(`${p.name} は労働基準監督署の指導で1回休み。`,'bad');
    render();
    setTimeout(endTurn,ms(1400));
    return;
  }
  // 1. 福利厚生を1枚引く
  const card=drawWelfare();
  if(card){p.hand.push(card);log(`${p.name} は福利厚生「${card.n}」を引いた。`);}
  render();
  if(p.ai){setTimeout(aiAction,ms(1300));}
}
function drawWelfare(){
  if(G.wdeck.length===0){
    if(G.wdiscard.length===0)return null;
    G.wdeck=shuffle(G.wdiscard);G.wdiscard=[];
  }
  return G.wdeck.pop();
}

/* ----- 採用（取り入れ） ----- */
function canAdopt(p,card){
  if(hasType(p,card.n))return false;             // 取り入れ済み不可
  const others=p.hand.filter(c=>c!==card).length;
  return others>=card.cost;                       // 投資費用ぶん手札が必要
}
function doAdopt(p,card,discards){
  p.hand=p.hand.filter(c=>c!==card&&!discards.includes(c));
  discards.forEach(d=>G.wdiscard.push(d));
  p.welfare.push(card);
  playSE('adopt');
  log(`${p.name} は「${card.n}」を導入！${card.cost>0?`（投資費用：手札${card.cost}枚を支払い）`:''}`,'good');
}

/* ----- サイコロ→移動→着地処理 ----- */
const DICEFACE=['','⚀','⚁','⚂','⚃','⚄','⚅'];
function showDice(p,val,rolling){
  const st=document.getElementById('diceStage');if(!st)return;
  st.innerHTML=`<div class="diceWho"><span style="color:${p.color}">●</span> ${p.name}${p.ai?'（AI）':''} がサイコロを振る</div>
    <div class="bigdie${rolling?' rolling':''}" style="border-color:${p.color}">${val?DICEFACE[val]:'🎲'}</div>
    ${(!rolling&&val)?`<div class="diceResult" style="background:${p.color}">${val} が出た！</div>`:''}`;
  st.classList.add('show');
}
function hideDice(){const st=document.getElementById('diceStage');if(st)st.classList.remove('show');}
function rollDice(){
  const p=G.players[G.cur];
  G.phase='moving';G.diceRolling=true;G.panelOpen=false;updatePanel();renderHandAndActions();
  // 盤面中央でサイコロをコロコロ回す演出（全プレイヤーぶん見える）
  let rolls=0;const total=10;
  showDice(p,null,true);
  const t=setInterval(()=>{
    G.dice=1+(Math.random()*6|0);showDice(p,G.dice,true);playSE('dice');rolls++;
    if(rolls>=total){
      clearInterval(t);G.diceRolling=false;
      G.dice=1+(Math.random()*6|0);showDice(p,G.dice,false);
      log(`${p.name} はサイコロを振った → ${G.dice}`,'sys');
      // 出目をしっかり見せてから移動
      setTimeout(()=>{hideDice();animateMove(p,G.dice,()=>resolveLanding(p));},ms(1300));
    }
  },ms(95));
}
function animateMove(p,steps,done){
  let left=steps;
  const t=setInterval(()=>{
    p.pos=(p.pos+1)%10;left--;render();playSE('step');
    if(left<=0){clearInterval(t);setTimeout(done,ms(550));}
  },ms(480));
}
function resolveLanding(p,chained){
  const cell=G.cells[p.pos];
  if(!cell){log(`${p.name} は空きマスに止まった。`);return finishResolve();}
  if(cell.type==='cand'){
    const cand=cell.cand;
    const sat=satisfies(p,cand);
    const outcome = sat ? 'join' : (cand.start ? 'think' : 'leave');
    // 演出を見せてから盤面を更新
    showCandidateScene(p,cand,outcome,()=>{
      if(outcome==='join'){
        p.employees.push({ph:cand.ph,hp:cand.hp,w:cand.w,img:cand.img});
        log(`🎉 ${p.name} の会社に「${cand.ph}」(ハッピーポイント${cand.hp}) が入社！`,'good');
        G.cells[p.pos]=drawCell(G.cdeck);checkDeck();
      }else if(outcome==='leave'){
        log(`${p.name} は「${cand.ph}」の願いを満たせず、候補は他の会社へ…`,'bad');
        G.matane.push(cand);
        G.cells[p.pos]=drawCell(G.cdeck);checkDeck();
      }else{
        log(`${p.name} は「${cand.ph}」の願いをまだ満たせていない（候補は残る）。`);
      }
      finishResolve();
    });
    return;
  }
  // イベント
  return resolveEvent(p,cell,chained);
}
function finishResolve(){render();setTimeout(endTurn,ms(950));}

function resolveEvent(p,cell,chained){
  const name=cell.name;
  const desc=(EVENTS[name]&&EVENTS[name].desc)||cell.desc||'';
  log(`${p.name} はイベント「${name}」に止まった。`,'sys');
  const after=()=>{
    if(cell.type==='event'){ // 山札由来のイベントは捨ててから補充
      G.matane.push({event:name});
      G.cells[p.pos]=drawCell(G.cdeck);
      checkDeck();
    }
    finishResolve();
  };
  if(name==='好景気'){
    G.players.forEach(q=>{const c=drawWelfare();if(c)q.hand.push(c);});
    log('好景気！ 全員が福利厚生を1枚 引いた。','good');
    render();
    return showEventScene({player:p,name,desc,festive:true,cls:'festive',sound:'win',dur:3000,
      result:'🎉 好景気で大盛り上がり！ 全員 福利厚生を1枚GET！'},after);
  }
  if(name==='不景気'){
    let cnt=0;
    G.players.forEach(q=>{
      if(q.hand.length>0){
        const owned=new Set(q.welfare.map(w=>w.n));
        q.hand.sort((a,b)=>keepVal(a,owned)-keepVal(b,owned));
        const drop=q.hand.shift();
        G.wdiscard.push(drop);cnt++;
      }
    });
    log(`不景気！ 各社が手札の福利厚生を1枚 手放した（${cnt}社）。`,'bad');
    render();
    return showEventScene({player:p,name,desc,cls:'bad',sound:'leave',
      result:`📉 不景気… 各社 手持ちの福利厚生カードを1枚 手放した`},after);
  }
  if(name==='労働基準監督署'){
    const ok=SOCIAL5.every(s=>hasType(p,s));
    if(ok){
      log(`${p.name} は社会保険5種を完備。問題なし。`,'good');
      return showEventScene({player:p,name,desc,cls:'good',sound:'join',
        result:'✅ 社会保険5種 完備！ 問題なし'},after);
    }
    p.skip=true;
    const lack=SOCIAL5.filter(s=>!hasType(p,s));
    log(`${p.name} は社会保険が未完備…次の番は1回休み。`,'bad');
    return showEventScene({player:p,name,desc,cls:'rest',sound:'buzzer',stamp:'1回休み',dur:3200,
      result:`⚠ 社会保険が未完備（不足：${lack.join('・')}）次の番はお休み…`},after);
  }
  if(name==='コストダウン'){
    const removable=p.welfare.filter(w=>!w.social); // 社会保険5種は外せない
    if(removable.length===0){
      log(`${p.name} には削れる福利厚生がなかった。`);
      return showEventScene({player:p,name,desc,cls:'good',sound:'think',
        result:'削れる福利厚生がなかった（社会保険5種は対象外）'},after);
    }
    if(p.ai){
      removable.sort((a,b)=>a.cost-b.cost||a.c.length-b.c.length);
      const tgt=removable[0];
      p.welfare=p.welfare.filter(w=>w!==tgt);
      log(`コストダウン：${p.name} は「${tgt.n}」を失った。`,'bad');
      render();
      return showEventScene({player:p,name,desc,cls:'bad',sound:'leave',
        result:`✂️ ${p.name} は「${tgt.n}」を失った…`},after);
    }
    return showEventScene({player:p,name,desc,cls:'bad',sound:'leave',
      result:'✂️ 福利厚生を1つ手放します…'},()=>modalCostdown(p,removable,after));
  }
  if(name==='ヘッドハンティング'){
    // 自社が願いを満たす他社社員を1人獲得
    const targets=[];
    G.players.forEach(q=>{if(q===p)return;q.employees.forEach(e=>{if(satisfies(p,e))targets.push({q,e});});});
    if(targets.length===0){
      log(`${p.name} が獲得できる他社社員はいなかった。`);
      return showEventScene({player:p,name,desc,cls:'good',sound:'think',
        result:'要望を満たせる他社の社員はいなかった'},after);
    }
    if(p.ai){
      targets.sort((a,b)=>b.e.hp-a.e.hp);
      const t=targets[0];
      t.q.employees=t.q.employees.filter(x=>x!==t.e);p.employees.push(t.e);
      log(`ヘッドハンティング！ ${p.name} が ${t.q.name} から「${t.e.ph}」を引き抜いた。`,'good');
      render();
      return showEventScene({player:p,name,desc,cls:'good',sound:'join',
        result:`🎯 ${t.q.name} から「${t.e.ph}」を引き抜いた！`},after);
    }
    return showEventScene({player:p,name,desc,cls:'good',sound:'join',
      result:'🎯 他社の社員を引き抜けます！'},()=>modalHeadhunt(p,targets,after));
  }
  if(name==='事業支援制度'){
    const movable=[];for(let i=0;i<10;i++){if(i!==p.pos&&i!==JIGYO_CELL)movable.push(i);}
    const startMove=()=>{
      if(p.ai){
        let best=null,bestScore=-1;
        movable.forEach(i=>{const cc=G.cells[i];let sc=0;
          if(cc&&cc.type==='cand'&&satisfies(p,cc.cand))sc=10+cc.cand.hp;
          if(cc&&cc.type==='fixed'&&cc.name==='好景気')sc=1;
          if(sc>bestScore){bestScore=sc;best=i;}});
        if(best==null)best=movable[Math.random()*movable.length|0];
        p.pos=best;render();
        log(`事業支援制度：${p.name} は好きなマスへ移動した。`,'sys');
        setTimeout(()=>resolveLanding(p,true),ms(800));
        return;
      }
      G.targetMode={player:p,cells:movable,cb:(i)=>{p.pos=i;render();
        log(`事業支援制度：${p.name} は移動先を選んだ。`,'sys');
        setTimeout(()=>resolveLanding(p,true),ms(700));}};
      render();
      log('事業支援制度！ 移動したいマスをクリックしてください。','sys');
    };
    return showEventScene({player:p,name,desc,cls:'move',sound:'adopt',
      result:'🚀 好きなマスへ移動できる！'},startMove);
  }
  return after();
}

function checkDeck(){
  if(G.cdeck.length===0&&!G.ending){
    G.ending=true;
    G.endAt=(G.startPlayer-1+G.players.length)%G.players.length;
    log('中央の山札がなくなった！ このまわりで最終ターンへ。','sys');
  }
}
function endTurn(){
  if(G.over)return;
  if(G.ending&&G.cur===G.endAt){return gameOver();}
  G.cur=(G.cur+1)%G.players.length;
  beginTurn();
}

   AI 行動
   ================================================================= */
function aiAction(){
  const p=G.players[G.cur];
  const plan=aiChooseAdopt(p);
  if(plan){
    doAdopt(p,plan.card,plan.discards);render();
    // どの福利厚生を導入したかクローズアップで見せてから進む
    showWelfareAnnounce(p,plan.card,()=>setTimeout(rollDice,ms(400)));
  }else{
    log(`${p.name} は今回は福利厚生を導入しなかった。`);
    setTimeout(rollDice,ms(1300));
  }
}
function aiChooseAdopt(p){
  const cov=coverage(p);
  const candidatesOnBoard=[];
  G.cells.forEach(c=>{if(c&&c.type==='cand')candidatesOnBoard.push(c.cand);});
  G.players.forEach(q=>q.employees.forEach(()=>{}));
  let best=null,bestScore=0;
  p.hand.forEach(card=>{
    if(!canAdopt(p,card))return;
    // 採用後カバーを試算
    const cov2={...cov};card.c.forEach(k=>cov2[k]++);
    let gain=0;
    candidatesOnBoard.forEach(cand=>{
      const before=Object.keys(cand.w).every(k=>cov[k]>=cand.w[k]);
      const after =Object.keys(cand.w).every(k=>cov2[k]>=cand.w[k]);
      if(!before&&after)gain+=10+cand.hp;
    });
    // 新規カラー獲得・社会保険完備への寄与で微加点
    card.c.forEach(k=>{if(cov[k]===0)gain+=1;});
    if(card.social&&!hasType(p,card.n))gain+=0.5;
    const sc=gain-card.cost*0.3+(card.cost===0?0.4:0);
    if(sc>bestScore){bestScore=sc;best=card;}
  });
  if(!best)return null;
  // 投資費用ぶん、価値の低い手札を捨てる
  const owned=new Set(p.welfare.map(w=>w.n));
  const fodder=p.hand.filter(c=>c!==best)
    .sort((a,b)=>keepVal(a,owned)-keepVal(b,owned));
  return {card:best,discards:fodder.slice(0,best.cost)};
}
function keepVal(card,owned){return (owned.has(card.n)?0:1)+card.cost*0.5;}

      ? '福利厚生を導入しました。サイコロを振って進みましょう。'

/* 福利厚生カードのクローズアップ（説明つき・導入処理） */
function showWelfareCloseup(card){
  const p=G.players[G.cur];
  const bg=document.getElementById('ccBg');
  const inner=document.getElementById('ccInner');
  let discardSel=[];
  function draw(){
    const adoptable=canAdopt(p,card);
    let reason='';
    if(!adoptable){reason=hasType(p,card.n)?'すでに導入済みです':'投資費用ぶんの手札（他のカード）が足りません';}
    const need=card.cost;
    const fodder=p.hand.filter(c=>c!==card);
    inner.innerHTML=`
      <div class="ccCard ${card.social?'social':''}">
        ${card.social?'<div class="shabadge">社</div>':''}
        <div class="ccCost">コスト ${card.cost}</div>
        ${WELFARE_IMAGES[card.n]?`<div class="ccImg"><img src="${WELFARE_IMAGES[card.n]}" alt=""></div>`:''}
        <div class="ccName">${card.n}</div>
        <div class="ccWish">${welfareCoverChips(card)}<span class="ccWishLbl">${card.c.map(k=>WISH[k].label).join('・')}の願いに対応</span></div>
      </div>
      <div class="ccDesc"><span class="ccDescLbl">💡 どんな制度？</span><div class="ccDescTxt">${WELFARE_DESC[card.n]||''}</div></div>
      ${adoptable
        ? (need>0
           ? `<div class="ccPayBox">
                <div class="ccPayHead">💰 投資費用：福利厚生カード ${need}枚で支払う</div>
                <div class="ccPaySub">下の手札を <b>${need}枚</b> タップして支払いに使います<span class="ccPayCount ${discardSel.length===need?'ok':''}">${discardSel.length} / ${need} 枚</span></div>
                <div class="ccFodder">${fodder.map((c,i)=>`<button class="ccfd${discardSel.includes(c)?' on':''}" data-i="${i}">
                    <span class="ccfdCheck">${discardSel.includes(c)?'✓':'＋'}</span>
                    <span class="ccfdCost">${c.cost}</span>
                    ${WELFARE_IMAGES[c.n]?`<img class="ccfdImg" src="${WELFARE_IMAGES[c.n]}" alt="">`:''}
                    <span class="ccfdName">${c.n}</span></button>`).join('')}</div>
              </div>`
           : `<div class="ccPay">✅ コスト0 ＝ 費用なしで導入できます。</div>`)
        : `<div class="ccPay bad">⚠ ${reason}</div>`}
      <div class="ccBtns">
        ${adoptable?`<button id="ccDo" ${need>0&&discardSel.length!==need?'disabled':''}>この福利厚生を導入する</button>`:''}
        <button class="ghost" id="ccCancel">${adoptable?'やめる':'とじる'}</button>
      </div>`;
    inner.querySelectorAll('.ccfd').forEach(b=>{b.onclick=()=>{const c=fodder[+b.dataset.i];
      if(discardSel.includes(c))discardSel=discardSel.filter(x=>x!==c);
      else if(discardSel.length<need)discardSel.push(c);
      draw();};});
    const doBtn=inner.querySelector('#ccDo');
    if(doBtn)doBtn.onclick=()=>{closeCC();doAdopt(p,card,[...discardSel]);G.adoptedThisTurn=true;render();};
    inner.querySelector('#ccCancel').onclick=closeCC;
  }
  draw();
  bg.style.display='flex';
  bg.onclick=(e)=>{if(e.target.id==='ccBg')closeCC();};
}

    b.onclick=()=>{sel=w;[...pick.children].forEach(c=>c.className='ghost');b.className='';document.getElementById('cdOk').disabled=false;};
    pick.appendChild(b);});
  document.getElementById('cdOk').onclick=()=>{
    p.welfare=p.welfare.filter(w=>w!==sel);
    log(`コストダウン：${p.name} は「${sel.n}」を外した。`,'bad');
    closeModal();after();
  };
}
function modalHeadhunt(p,targets,after){
  let sel=null;
  openModal(`<h2>ヘッドハンティング</h2><p>あなたの会社が願いを満たせる他社の社員を1人 引き抜けます。</p>
    <div class="pick" id="hhPick"></div>
    <div class="row"><button class="ghost" id="hhSkip">引き抜かない</button><button id="hhOk" disabled>引き抜く</button></div>`);
  const pick=document.getElementById('hhPick');
  targets.forEach(t=>{const b=document.createElement('button');b.className='ghost';
    b.innerHTML=`${t.e.ph} <b>😊${t.e.hp}</b><br><small>${t.q.name} から</small>`;
    b.onclick=()=>{sel=t;[...pick.children].forEach(c=>c.className='ghost');b.className='';document.getElementById('hhOk').disabled=false;};
    pick.appendChild(b);});
  document.getElementById('hhSkip').onclick=()=>{closeModal();after();};
  document.getElementById('hhOk').onclick=()=>{
    sel.q.employees=sel.q.employees.filter(x=>x!==sel.e);p.employees.push(sel.e);
    log(`ヘッドハンティング！ ${p.name} が ${sel.q.name} から「${sel.e.ph}」を引き抜いた。`,'good');
    closeModal();after();
  };
}

function gameOver(){
  G.over=true;
  const ranked=[...G.players].sort((a,b)=>score(b)-score(a)||b.employees.length-a.employees.length);
  const top=score(ranked[0]);
  const winners=ranked.filter(p=>score(p)===top);
  log('=== ゲーム終了！ ===','sys');
  if(AUD.ctx&&AUD.bgmGain){AUD.bgmGain.gain.linearRampToValueAtTime(0,AUD.ctx.currentTime+0.6);}
  if(AUD.bgmTimer){clearInterval(AUD.bgmTimer);AUD.bgmTimer=null;}
  showFinale(ranked,winners,top);
}
function showFinale(ranked,winners,top){
  const bg=document.getElementById('finaleBg');bg.style.display='flex';
  const stage=document.getElementById('finaleStage');
  const rank=document.getElementById('finaleRank');rank.style.display='none';rank.innerHTML='';
  const winNames=winners.map(w=>w.name).join(' ・ ');
  const reveal=`<div class="winnerWrap">
      <div class="crown">👑</div>
      <div class="winnerMeeples">${winners.map(w=>`<span class="winnerAv">${meepleSVG(w.color)}</span>`).join('')}</div>
      <div class="winnerName">${winNames} 社長！</div>
      <div class="winnerHp">ハッピーポイント ${top} で「はっぴーかんぱにー」達成！</div></div>`;
  const steps=[
    {html:`<div class="fbig">🎉 ゲーム終了！</div>`,t:1700,se:'gong'},
    {html:`<div class="fbig">結果発表！</div>`,t:1700,se:'drum'},
    {html:`<div class="fbig">はっぴーかんぱにーを<br>作ったのは…</div>`,t:2300,se:'drum'},
    {html:reveal,final:true,se:'win'}
  ];
  let i=0,advTimer=null;
  function showRank(){
    rank.innerHTML=`<table><tr><th>順位</th><th>会社</th><th>社員</th><th>😊ハッピー<br>ポイント</th></tr>
      ${ranked.map((p,idx)=>`<tr class="${score(p)===top?'win':''}">
        <td>${idx+1}位</td>
        <td><span class="rkav">${meepleSVG(p.color)}</span>${p.name}${p.ai?'':'（あなた）'}</td>
        <td>${p.employees.length}人</td><td><b>${score(p)}</b></td></tr>`).join('')}
      </table>
      <div style="text-align:center;margin-top:14px;"><button onclick="location.reload()">もう一度遊ぶ ▶</button></div>`;
    rank.style.display='block';
  }
  function step(){
    if(i>=steps.length)return;
    const s=steps[i++];
    stage.innerHTML=s.html;stage.classList.remove('pop');void stage.offsetWidth;stage.classList.add('pop');
    if(s.se)playSE(s.se);
    if(s.final){
      launchConfetti(document.getElementById('confetti'),6000);
      bg.onclick=null;
      setTimeout(showRank,1300);
      return;
    }
    advTimer=setTimeout(step,s.t);
  }
  bg.onclick=()=>{if(advTimer){clearTimeout(advTimer);advTimer=null;}step();};
  step();
}

function log(msg,cls){const l=document.getElementById('log');const d=document.createElement('div');
  if(cls)d.className=cls;d.textContent=msg;l.appendChild(d);l.scrollTop=l.scrollHeight;}
function toggleLog(){
  const w=document.getElementById('logwrap');w.classList.toggle('collapsed');
  w.querySelector('.logtgl').textContent=w.classList.contains('collapsed')?'開く ▼':'閉じる ▲';
}
